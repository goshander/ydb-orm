name: Test Docker Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    name: test-docker-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:docker:smoke
      - if: always()
        run: npm run test:docker:clean
