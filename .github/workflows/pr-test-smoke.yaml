name: Test Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    name: test-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docker:db-up
      - run: npm run test:smoke
        env:
          YDB_ENDPOINT: grpc://localhost:2136
          YDB_DATABASE: /local
      - if: always()
        run: npm run docker:db-down
