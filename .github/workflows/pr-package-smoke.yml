name: PR Package Smoke

on:
  pull_request:

jobs:
  package-smoke:
    name: Package Smoke on Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d database
      - run: sleep 15
      - run: docker compose run --rm package-smoke
        env:
          NODE_DOCKER_PLATFORM: linux/amd64
      - if: always()
        run: docker compose down -v
